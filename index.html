r der ideale Ausgangspunkt für Wanderungen, Skivergnügen oder einfach zum Seele baumeln lassen.Wählen Sie Ihre Unterkunft:Klicken Sie im Menü auf die Obertennhütte für einen Urlaub im eigenen Almhaus mit bis zu 10 Personen, oder auf den Obertennhof für gemütliche Stunden auf unserem traditionellen Bergbauernhof.Über die ObertennhütteIn absoluter Alleinlage am Sonnenhang, etwa 3km über dem Ort Viehhofen im Skigebiet Saalbach-Hinterglemm gelegen. Im Sommer weiden Schafe und Pferde auf der Alm nebenan.Personenbis 10Wohnfläche100 m²Seehöhe1.225 mZimmer3 Doppel-, 1 ZweibettzimmerDie Hütte wurde vom Hüttenbesitzer selbst mit viel persönlichem Einsatz gebaut: Hüttenstube mit Couchecke und SAT-TV, Küchenzeile mit E-Herd, Backofen, Holzherd, Kühlschrank, Mikrowelle, Geschirrspüler und Kaffeemaschine. Kostenloses WLAN und Holzzentralheizung vorhanden.Impressionen der HütteWerfen Sie einen Blick auf die traditionelle Bauweise und die traumhafte Umgebung der Obertennhütte. Vor der Hütte erwartet Sie ein sonniger Sitzplatz mit Liegestühlen, Griller und herrlicher Aussicht.Die gemütlichen InnenräumeHolz sorgt für die typische, gemütliche Hüttenatmosphäre. Genießen Sie gesellige Abende in der großen Stube oder kochen Sie gemeinsam in der voll ausgestatteten Küche.Der ObertennhofErleben Sie Urlaub auf einem echten, traditionsreichen Bergbauernhof. Unser Hof wird liebevoll bewirtschaftet und bietet Ihnen einen authentischen Einblick in das Landleben im Pinzgau.BesonderheitFamilienfreundlichHofprodukteFrische Milch & EierIdeal für Familien mit Kindern, die die Tiere hautnah erleben möchten und die Natur ungestört entdecken wollen.Bilder vom HoflebenUnser Hof bietet zu jeder Jahreszeit einen herrlichen Rückzugsort. Genießen Sie die hofeigene Atmosphäre und das Panorama über das Tal.Die Urlaubsregion PinzgauViehhofen liegt strategisch perfekt. In nur wenigen Minuten erreichen Sie das weltbekannte Skigebiet Saalbach Hinterglemm Leogang Fieberbrunn sowie die wunderschöne Bergstadt Zell am See mit dem glasklaren Zeller See.Sommeraktivitäten:Wandern, Mountainbiken, Schwimmen im See, Klettern oder Ausflüge zum Großglockner und den Krimmler Wasserfällen.Winteraktivitäten:Skifahren und Snowboarden in zwei der besten Skigebiete Österreichs, Winterwandern, Rodeln oder Langlaufen.© 2026 Der Hüttenfux - Familie Neumayer - Viehhofen, Österreich// Navigation Logikconst navLinks = document.querySelectorAll('.nav-item');const sections = document.querySelectorAll('.content-section');navLinks.forEach(link => {link.addEventListener('click', function(e) {e.preventDefault();const targetSection = this.getAttribute('data-section');navLinks.forEach(l => l.classList.remove('active'));sections.forEach(s => s.classList.remove('active'));this.classList.add('active');document.getElementById('section-' + targetSection).classList.add('active');window.scrollTo({ top: document.querySelector('.main-container').offsetTop - 20, behavior: 'smooth' });});});// Sprach-Ubersetzungs-Datenconst translations = {de: {"header-title": "Der Hüttenfux","header-subtitle": "Obertennhütte & Obertennhof","banner-zell": "Der malerische Zeller See, die charmante Altstadt und die Bergwelt der Schmittenhöhe.","banner-saalbach": "270 Pistenkilometer im Winter, 400km Wanderwege im Sommer – das Skicircus Gebiet.","banner-title-unterkunft": "Obertennhof & Hütte","banner-unterkunft": "Unsere zwei Unterkünfte in absoluter Alleinlage über Viehhofen – urig, ruhig und mit Bergblick.","more-info": "Mehr erfahren »","nav-home": "Home","nav-huette": "OBERTENNHÜTTE","nav-diehuette": "• Die Hütte","nav-diezimmer": "• Die Zimmer","nav-hof": "OBERTENNHOF","nav-derhof": "• Der Hof","nav-umgebung": "UMGEBUNG","home-title": "Herzlich Willkommen beim Hüttenfux!","home-p1": "Erleben Sie unvergessliche Tage im Herzen des Pinzgaus. Unsere beiden Unterkünfte, die urige Obertennhütte und der traditionelle Obertennhof, bieten Ihnen die perfekte Mischung aus Ruhe, Natur und Tiroler Gastfreundschaft.","home-p2": "Gelegen am son
